[package]
name = "gpui-omarchy"
version = "0.1.3"
edition = "2024"
exclude = ["website/**", "examples/gallery-wasm/**"]
license = "MIT"
description = "A gpui-kit component library designed for the Omarchy system and its UI and UX conventions"
repository = "https://github.com/huacnlee/gpui-omarchy"

[dependencies]
# Pinned to gpui-kit main for longbridge/gpui-kit#3277 (centered base dialog
# popup) and #3278 (centered single-line input). Do not publish this crate
# until a gpui-kit release includes them; then return to a version pin.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "f197a197888833312a0fa8109e3c01ad6fc29913", default-features = false, features = ["assets"] }
toml = "0.8"
chrono = "0.4.45"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-channel = "2"
notify = "7"

[dev-dependencies]
tempfile = "3"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "f197a197888833312a0fa8109e3c01ad6fc29913", default-features = false, features = ["test-support"] }

[profile.dev]
debug = "limited"

# gpui-pre-macros 0.3.1 leaves a helper ungated in release builds while its
# module is gated on debug_assertions. Enable it for the host proc-macro only.
[profile.release.package.gpui-pre-macros]
debug-assertions = true
