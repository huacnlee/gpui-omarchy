[package]
name = "gpui-omarchy"
version = "0.2.1"
edition = "2024"
exclude = ["website/**", "examples/gallery-wasm/**"]
license = "MIT"
description = "A gpui-kit component library designed for the Omarchy system and its UI and UX conventions"
repository = "https://github.com/huacnlee/gpui-omarchy"

[features]
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast"]

# Await gpui-kit PR #3375; replace the Git source with a released version before publishing.
[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "add-gpui-fast-feature", version = "0.7.1", default-features = false, features = ["assets"] }
toml = "0.8"
chrono = "0.4.45"
itertools = "0.13"
num-traits = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-channel = "2"
notify = "7"

[dev-dependencies]
tempfile = "3"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "add-gpui-fast-feature", version = "0.7.1", default-features = false, features = ["test-support"] }

[profile.dev]
debug = "limited"

# gpui-pre-macros 0.3.1 leaves a helper ungated in release builds while its
# module is gated on debug_assertions. Enable it for the host proc-macro only.
[profile.release.package.gpui-pre-macros]
debug-assertions = true
