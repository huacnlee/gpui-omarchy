[package]
name = "gpui-omarchy"
version = "0.1.2"
edition = "2024"
exclude = ["website/**", "examples/gallery-wasm/**"]
license = "MIT"
description = "A gpui-kit component library designed for the Omarchy system and its UI and UX conventions"
repository = "https://github.com/huacnlee/gpui-omarchy"

[dependencies]
# gpui-kit-assets carries the shared Lucide IconName from longbridge/gpui-kit#3020.
# Move back to a published version once that release is out.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "abc47ce5b522de4b7300ea57e77236b2d95a1c4f", default-features = false, features = ["assets"] }
toml = "0.8"
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "abc47ce5b522de4b7300ea57e77236b2d95a1c4f", default-features = false, features = ["test-support"] }

[profile.dev]
debug = "limited"

# gpui-pre-macros 0.3.1 leaves a helper ungated in release builds while its
# module is gated on debug_assertions. Enable it for the host proc-macro only.
[profile.release.package.gpui-pre-macros]
debug-assertions = true
