[package]
name = "gpui-omarchy-gallery-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui-omarchy = { path = "../.." }
# Must match the source gpui-omarchy uses: two copies of gpui-kit-assets
# would both claim the `gpui-kit-default-icons` links key.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "abc47ce5b522de4b7300ea57e77236b2d95a1c4f", default-features = false, features = ["assets"] }
chrono = "0.4.45"
wasm-bindgen = "=0.2.121"
web-time = "1"

[profile.release]
lto = "thin"
opt-level = "s"
debug = false

# gpui-pre-macros 0.3.1 leaves a helper ungated in release builds while its
# module is gated on debug_assertions. Keep this host proc-macro's module
# enabled without enabling the runtime inspector in the gallery.
[profile.release.package.gpui-pre-macros]
debug-assertions = true
